<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="termShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="playGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feFlood flood-color="#93c5fd" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="120" y="150" width="784" height="660" rx="40"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Terminal window -->
  <rect x="120" y="150" width="784" height="660" rx="40" fill="#0f172a" filter="url(#termShadow)"/>

  <!-- Clipped elements inside terminal -->
  <g clip-path="url(#termClip)">
    <!-- Title bar -->
    <rect x="120" y="150" width="784" height="80" fill="#020617"/>
    <line x1="120" y1="230" x2="904" y2="230" stroke="#1e293b" stroke-width="1.5"/>

    <!-- npm red accent bar at bottom -->
    <rect x="120" y="760" width="784" height="50" fill="#CB3837"/>

    <!-- Terminal prompt hint lines -->
    <rect x="190" y="280" width="60" height="6" rx="3" fill="#3b82f6" opacity="0.5"/>
    <rect x="265" y="280" width="180" height="6" rx="3" fill="#475569" opacity="0.4"/>

    <rect x="190" y="700" width="40" height="6" rx="3" fill="#3b82f6" opacity="0.5"/>
    <rect x="245" y="700" width="120" height="6" rx="3" fill="#475569" opacity="0.4"/>
  </g>

  <!-- Traffic lights -->
  <circle cx="188" cy="190" r="16" fill="#ff5f57"/>
  <circle cx="240" cy="190" r="16" fill="#febc2e"/>
  <circle cx="292" cy="190" r="16" fill="#28c840"/>

  <!-- Play/Launch button -->
  <polygon points="380,320 380,680 650,500" fill="url(#playGrad)" filter="url(#playGlow)"/>
</svg>
