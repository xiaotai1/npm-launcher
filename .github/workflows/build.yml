name: 构建与发布

on:
  push:
    branches: [master, master-rust]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 更新逻辑测试
        run: npm run test:updater

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 构建普通安装包
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/npm-launcher.exe" "release-output/NPM-Launcher-Portable-Windows-x64.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe"

      - name: 整理 macOS Intel 产物
        if: matrix.name == 'macos-intel'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Intel.dmg"

      - name: 整理 macOS Apple Silicon 产物
        if: matrix.name == 'macos-apple-silicon'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Apple-Silicon.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-output/*
          if-no-files-found: error

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    name: 发布 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: 校验发布版本
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      - name: 校验更新签名密钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "release Environment 缺少 Secret：TAURI_SIGNING_PRIVATE_KEY"
          }

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 更新逻辑测试
        run: npm run test:updater

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 构建签名更新包
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/npm-launcher.exe" "release-output/NPM-Launcher-Portable-Windows-x64.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          $signature = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) { throw "未找到 NSIS 更新签名" }
          Copy-Item $installer.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe"
          Copy-Item $signature.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe.sig"

      - name: 整理 macOS Intel 产物
        if: matrix.name == 'macos-intel'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          updater=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name '*.app.tar.gz' -type f | head -n 1)
          test -n "$dmg"
          test -n "$updater"
          test -f "$updater.sig"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Intel.dmg"
          cp "$updater" "release-output/NPM-Launcher-Updater-macOS-Intel.app.tar.gz"
          cp "$updater.sig" "release-output/NPM-Launcher-Updater-macOS-Intel.app.tar.gz.sig"

      - name: 整理 macOS Apple Silicon 产物
        if: matrix.name == 'macos-apple-silicon'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          updater=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name '*.app.tar.gz' -type f | head -n 1)
          test -n "$dmg"
          test -n "$updater"
          test -f "$updater.sig"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Apple-Silicon.dmg"
          cp "$updater" "release-output/NPM-Launcher-Updater-macOS-Apple-Silicon.app.tar.gz"
          cp "$updater.sig" "release-output/NPM-Launcher-Updater-macOS-Apple-Silicon.app.tar.gz.sig"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-output/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 校验更新元数据并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -print | sort)
          if [[ ${#assets[@]} -ne 4 ]]; then
            printf '应生成 4 个安装文件，实际为 %s 个\n' "${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          require_asset() {
            local name="$1"
            local matches
            mapfile -t matches < <(find release-assets -type f -name "$name" -print)
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf '构建产物 %s 应有 1 个，实际为 %s 个\n' "$name" "${#matches[@]}" >&2
              return 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          windows_updater=$(require_asset 'NPM-Launcher-Setup-Windows-x64.exe')
          windows_signature=$(require_asset 'NPM-Launcher-Setup-Windows-x64.exe.sig')
          macos_intel_updater=$(require_asset 'NPM-Launcher-Updater-macOS-Intel.app.tar.gz')
          macos_intel_signature=$(require_asset 'NPM-Launcher-Updater-macOS-Intel.app.tar.gz.sig')
          macos_arm_updater=$(require_asset 'NPM-Launcher-Updater-macOS-Apple-Silicon.app.tar.gz')
          macos_arm_signature=$(require_asset 'NPM-Launcher-Updater-macOS-Apple-Silicon.app.tar.gz.sig')

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "NPM Launcher $RELEASE_TAG"
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json

          version=${RELEASE_TAG#v}
          notes=$(jq -r '.body // ""' release.json)
          pub_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          release_base_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          windows_url="$release_base_url/$(basename "$windows_updater")"
          macos_intel_url="$release_base_url/$(basename "$macos_intel_updater")"
          macos_arm_url="$release_base_url/$(basename "$macos_arm_updater")"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg windows_url "$windows_url" \
            --arg macos_intel_url "$macos_intel_url" \
            --arg macos_arm_url "$macos_arm_url" \
            --rawfile windows_signature "$windows_signature" \
            --rawfile macos_intel_signature "$macos_intel_signature" \
            --rawfile macos_arm_signature "$macos_arm_signature" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $windows_url, signature: $windows_signature },
                "windows-x86_64-nsis": { url: $windows_url, signature: $windows_signature },
                "darwin-x86_64": { url: $macos_intel_url, signature: $macos_intel_signature },
                "darwin-x86_64-app": { url: $macos_intel_url, signature: $macos_intel_signature },
                "darwin-aarch64": { url: $macos_arm_url, signature: $macos_arm_signature },
                "darwin-aarch64-app": { url: $macos_arm_url, signature: $macos_arm_signature }
              }
            }' > latest.json

          for target in windows-x86_64 darwin-x86_64 darwin-aarch64; do
            jq -e --arg target "$target" '.platforms[$target].url and .platforms[$target].signature' latest.json >/dev/null || {
              printf 'latest.json 缺少更新目标：%s\n' "$target"
              exit 1
            }
          done

          gh release upload "$RELEASE_TAG" latest.json "${assets[@]}" \
            "$windows_signature" \
            "$macos_intel_updater" \
            "$macos_intel_signature" \
            "$macos_arm_updater" \
            "$macos_arm_signature" \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
