name: 构建与发布

on:
  push:
    branches: [master, master-rust]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 更新逻辑测试
        run: npm run test:updater

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 构建普通安装包
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/npm-launcher.exe" "release-output/NPM-Launcher-Portable-Windows-x64.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe"

      - name: 整理 macOS Intel 产物
        if: matrix.name == 'macos-intel'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Intel.dmg"

      - name: 整理 macOS Apple Silicon 产物
        if: matrix.name == 'macos-apple-silicon'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Apple-Silicon.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-output/*
          if-no-files-found: error

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    name: 发布 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: 校验发布版本
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      - name: 校验更新签名密钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "release Environment 缺少 Secret：TAURI_SIGNING_PRIVATE_KEY"
          }

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 更新逻辑测试
        run: npm run test:updater

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 构建并上传签名更新包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NPM Launcher ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/npm-launcher.exe" "release-output/NPM-Launcher-Portable-Windows-x64.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe"

      - name: 整理 macOS Intel 产物
        if: matrix.name == 'macos-intel'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Intel.dmg"

      - name: 整理 macOS Apple Silicon 产物
        if: matrix.name == 'macos-apple-silicon'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Apple-Silicon.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-output/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 校验更新元数据并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -print | sort)
          if [[ ${#assets[@]} -ne 4 ]]; then
            printf '应生成 4 个安装文件，实际为 %s 个\n' "${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json

          find_asset_name() {
            local pattern="$1"
            local matches
            local count
            matches=$(jq -c --arg pattern "$pattern" '[.assets[] | select(.name | test($pattern))]' release.json)
            count=$(jq 'length' <<<"$matches")
            if [[ "$count" -ne 1 ]]; then
              printf '更新签名匹配异常，规则 %s 找到 %s 个文件：\n' "$pattern" "$count" >&2
              jq -r '.[].name' <<<"$matches" >&2
              return 1
            fi
            jq -r '.[0].name' <<<"$matches"
          }

          asset_url() {
            local name="$1"
            jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' release.json
          }

          windows_signature_name=$(find_asset_name '\.exe\.sig$')
          macos_intel_signature_name=$(find_asset_name '_(x64|x86_64)\.app\.tar\.gz\.sig$')
          macos_arm_signature_name=$(find_asset_name '_(aarch64|arm64)\.app\.tar\.gz\.sig$')

          windows_updater_name=${windows_signature_name%.sig}
          macos_intel_updater_name=${macos_intel_signature_name%.sig}
          macos_arm_updater_name=${macos_arm_signature_name%.sig}

          windows_url=$(asset_url "$windows_updater_name")
          macos_intel_url=$(asset_url "$macos_intel_updater_name")
          macos_arm_url=$(asset_url "$macos_arm_updater_name")

          mkdir -p updater-signatures
          gh release download "$RELEASE_TAG" --pattern "$windows_signature_name" --dir updater-signatures
          gh release download "$RELEASE_TAG" --pattern "$macos_intel_signature_name" --dir updater-signatures
          gh release download "$RELEASE_TAG" --pattern "$macos_arm_signature_name" --dir updater-signatures

          version=${RELEASE_TAG#v}
          notes=$(jq -r '.body // ""' release.json)
          pub_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg windows_url "$windows_url" \
            --arg macos_intel_url "$macos_intel_url" \
            --arg macos_arm_url "$macos_arm_url" \
            --rawfile windows_signature "updater-signatures/$windows_signature_name" \
            --rawfile macos_intel_signature "updater-signatures/$macos_intel_signature_name" \
            --rawfile macos_arm_signature "updater-signatures/$macos_arm_signature_name" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $windows_url, signature: $windows_signature },
                "windows-x86_64-nsis": { url: $windows_url, signature: $windows_signature },
                "darwin-x86_64": { url: $macos_intel_url, signature: $macos_intel_signature },
                "darwin-x86_64-app": { url: $macos_intel_url, signature: $macos_intel_signature },
                "darwin-aarch64": { url: $macos_arm_url, signature: $macos_arm_signature },
                "darwin-aarch64-app": { url: $macos_arm_url, signature: $macos_arm_signature }
              }
            }' > latest.json

          for target in windows-x86_64 darwin-x86_64 darwin-aarch64; do
            jq -e --arg target "$target" '.platforms[$target].url and .platforms[$target].signature' latest.json >/dev/null || {
              printf 'latest.json 缺少更新目标：%s\n' "$target"
              exit 1
            }
          done

          gh release upload "$RELEASE_TAG" latest.json "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
