name: 构建与发布

on:
  push:
    branches: [master, master-rust]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: npm ci

      - name: 校验发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-version.js "${{ github.ref_name }}"

      - name: 校验更新签名密钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 GitHub Secret：TAURI_SIGNING_PRIVATE_KEY"
          }

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 更新逻辑测试
        run: npm run test:updater

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 构建安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 构建并上传签名更新包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NPM Launcher ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/npm-launcher.exe" "release-output/NPM-Launcher-Portable-Windows-x64.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName "release-output/NPM-Launcher-Setup-Windows-x64.exe"

      - name: 整理 macOS Intel 产物
        if: matrix.name == 'macos-intel'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Intel.dmg"

      - name: 整理 macOS Apple Silicon 产物
        if: matrix.name == 'macos-apple-silicon'
        shell: bash
        run: |
          mkdir -p release-output
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" "release-output/NPM-Launcher-macOS-Apple-Silicon.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-output/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 校验更新元数据并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -print | sort)
          if [[ ${#assets[@]} -ne 4 ]]; then
            printf '应生成 4 个安装文件，实际为 %s 个\n' "${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          mkdir -p updater-metadata
          gh release download "$RELEASE_TAG" --pattern latest.json --dir updater-metadata
          for target in windows-x86_64 darwin-x86_64 darwin-aarch64; do
            jq -e --arg target "$target" '.platforms[$target].url and .platforms[$target].signature' updater-metadata/latest.json >/dev/null || {
              printf 'latest.json 缺少更新目标：%s\n' "$target"
              exit 1
            }
          done

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
